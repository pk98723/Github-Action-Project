name: CICD pipeline

on:
  push:
    branches: ["dev"]

jobs:
  compile:
    runs on: Ubuntu-Latest

steps:
- uses: actions/checkout@v4
- name: Setup JDK 17
  uses: actions/setup java@v4
  with:
    java-version: '17'
    distribution: 'temurin'
    cache: maven
- name: Build with Maven
  run: mvn -B package --file pom2.xml
